<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment & Admin Dashboard</title>
</head>
<body>
    
        <fieldset>
            <center>
                <legend><h1>Payment Form</h1></legend>
            </center>


    <hr>
<center>
    <form action="/submit-payment" method="POST">
        
        <fieldset>
            <center><h2><legend>Member Details</legend></h2></center>
            
            <p>
                <label for="member-id">Member ID:</label><br>
                <input type="text" id="member-id" name="member_id" placeholder="e.g., USR_04112" required>
            </p>

            <p>
                <label for="member-name">Member Name:</label><br>
                <input type="text" id="member-name" name="member_name" placeholder="Enter name" required>
            </p>
        </fieldset>
</center>
        <br>
<center>
        <fieldset>
            <center><h2><legend>Payment Details</legend></h2></center>

            <p>
                <label for="payment-amount">Amount (LKR):</label><br>
                <input type="number" id="payment-amount" name="amount" min="1" step="0.01" placeholder="50.00" required>
            </p>

            <p>
                <label for="payment-method">Payment Method:</label><br>
                <select id="payment-method" name="payment_method">
                    <option value="stripe">Stripe (Credit Card)</option>
                    <option value="paypal">PayPal</option>
                    <option value="bank">Direct Bank Transfer</option>
                </select>
            </p>

            <p>
                <label for="payment-status">Payment Status:</label><br>
                <input type="radio" id="status-paid" name="status" value="paid" checked>
                <label for="status-paid">Paid</label>

                <input type="radio" id="status-pending" name="status" value="pending">
                <label for="status-pending">Pending</label>
            </p>
        </fieldset>
</center>
        <br>
<center>
        <fieldset>
            <center><h2><legend>System Actions</legend></h2></center>
            <p>
                <input type="checkbox" id="gen-invoice" name="generate_invoice" value="yes" checked>
                <label for="gen-invoice">Generate Invoice</label>
            </p>
            <p>
                <input type="checkbox" id="send-notif" name="send_notification" value="yes" checked>
                <label for="send-notif">Send Notification</label>
            </p>
        </fieldset>

</center> 
       <br>
<center>
        <fieldset>
        <button type="submit">Submit Payment</button>
        <button type="reset">Reset Form</button>
        </fieldset>
</center>
    </form>


    
    
</body>
</html>
